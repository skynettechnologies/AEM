<!--/*
  Paid Features > widget behavior switches (sent as 1 / 0)
    widget_leave_page  Enable External Link Navigation On Widget
    is_sound_disabled  Disable Open Close sound on Widget
*/-->
<div class="aioa-pair">
    <label class="aioa-card aioa-toggle-card" for="widget_leave_page">
        <input type="checkbox" role="switch" class="aioa-switch" id="widget_leave_page" name="widget_leave_page" value="1"/>
        <span>Enable External Link Navigation On Widget</span>
    </label>
    <label class="aioa-card aioa-toggle-card" for="is_sound_disabled">
        <input type="checkbox" role="switch" class="aioa-switch" id="is_sound_disabled" name="is_sound_disabled" value="1"/>
        <span>Disable Open Close sound on Widget</span>
    </label>
</div>
