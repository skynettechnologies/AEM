<!--/*
  Settings > Icon size for desktop: preset sizes or an exact size in pixels when "Set an exact size"
  is checked. Each preview is drawn at its own size (--d), from Big down to Extra small.
*/-->
<section class="aioa-card" aria-labelledby="icon-size-title" data-sly-use.model="com.skynettechnologies.aem.aioa.core.models.SettingsPageModel">
    <h2 id="icon-size-title">Icon size for desktop</h2>
    <p class="aioa-desc">Pick a preset size or set an exact size in pixels.</p>

    <!-- Preset sizes <-> exact size -->
    <label class="aioa-check">
        <input type="checkbox" id="custom-size-switcher" aria-controls="custom-size-controls select_icon_size"/>
        Set an exact size in pixels
    </label>

    <!-- Preset sizes -->
    <fieldset class="aioa-fieldset widget-icon" id="select_icon_size">
        <legend class="visually-hidden">Select icon size for desktop</legend>
        <div class="aioa-size-row">
            <div class="aioa-icon-option" data-sly-repeat.size="${model.iconSizes}">
                <input type="radio" class="aioa-radio" id="${size.id}" name="aioa_icon_size" value="${size.value}" checked="${size.checked}"/>
                <label for="${size.id}" class="aioa-icon-label">
                    <span class="aioa-icon" style="--d:${size.diameter @ context='styleToken'}px"><img src="${model.iconBase}aioa-icon-type-1.svg" class="iconimg" alt=""/></span>
                    <span class="aioa-icon-caption">${size.label}</span>
                </label>
            </div>
        </div>
    </fieldset>

    <!-- Exact size (20 - 150 px) -->
    <div class="aioa-subpanel custom-size-controls" id="custom-size-controls" hidden>
        <label class="aioa-label" for="widget_icon_size_custom">Exact icon size</label>
        <div class="aioa-affix aioa-size-input" data-for="widget_icon_size_custom">
            <input type="number" id="widget_icon_size_custom" name="widget_icon_size_custom" min="20" max="150" step="1" inputmode="numeric" value="" aria-describedby="size-range-hint size-error"/>
            <span class="aioa-affix-text" aria-hidden="true">px</span>
        </div>
        <p class="aioa-hint" id="size-range-hint">20 - 150px are permitted values</p>
        <!-- Shown when the field is left or saved empty / outside 20 - 150 px (js/settings-form.js) -->
        <p class="aioa-error" id="size-error" hidden></p>
    </div>
</section>
