<!--/*
  Reusable HTL templates of the settings console (the EJS partials that took parameters).
    tab        one tab button              (views/partials/tabs.ejs)
    lock       free plan overlay           (views/partials/lock.ejs)
    scoreCard  Accessibility Score card    (views/partials/score/card.ejs)
*/-->

<!--/* Tab button. Locked tabs show a lock while the website is not on a paid plan (AIOA.tabs.setPlan). */-->
<template data-sly-template.tab="${@ id, label, locked, first}">
    <button type="button" role="tab" class="aioa-tab" id="tab-${id}" data-tab="${id}"
        aria-controls="panel-${id}" aria-selected="${first ? 'true' : 'false'}" tabindex="${first ? '0' : '-1'}">
        <span class="aioa-tab-label">${label}</span>
        <span class="aioa-tab-lock" data-tab-lock hidden data-sly-test="${locked}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span class="visually-hidden">(paid plan)</span>
        </span>
    </button>
</template>

<!--/*
  Free plan overlay for a paid tab: centered card over the blurred tab content.
    lockId   id prefix for the card text (aria-labelledby)
    lockMod  extra class: '' (card near the top) or 'is-center' (short content)
*/-->
<template data-sly-template.lock="${@ lockId, lockMod}"
    data-sly-use.model="com.skynettechnologies.aem.aioa.core.models.SettingsPageModel">
    <div class="aioa-lock ${lockMod}" hidden>
        <div class="aioa-lock-card" role="group" aria-labelledby="${lockId}-text">
            <span class="aioa-lock-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <p class="aioa-lock-text" id="${lockId}-text">Try a 10-day free trial to view all 90+ features.</p>
            <a href="${model.upgradeUrl}" target="_blank" rel="noopener" class="aioa-btn aioa-btn-primary">
                Upgrade to Paid Plan
                <span class="visually-hidden">(opens in a new tab)</span>
            </a>
        </div>
    </div>
</template>

<!--/*
  Accessibility Score card: status, score ring and three figures.
    sample=false  live card, filled by js/score.js ([data-field] elements)
    sample=true   fixed example values behind the free plan blur (no ids)
*/-->
<template data-sly-template.scoreCard="${@ sample}">
    <section class="aioa-card aioa-score" data-level="compliant"
        id="${sample ? '' : 'score-card'}" aria-labelledby="${sample ? '' : 'score-title'}" hidden="${!sample}">
        <div class="aioa-score-head">
            <h2 id="${sample ? '' : 'score-title'}">Accessibility Score</h2>
            <p class="aioa-score-status" data-field="status">${sample ? 'Compliant' : ''}</p>
        </div>

        <div class="aioa-score-body">
            <!-- Score ring: --p is the score in percent -->
            <div class="aioa-donut" style="--p:${sample ? '98' : '0' @ context='styleToken'}" role="img" aria-label="Accessibility score ${sample ? '98' : '0'}%">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="aioa-donut-track" cx="60" cy="60" r="52"/>
                    <circle class="aioa-donut-bar" cx="60" cy="60" r="52" pathLength="100"/>
                </svg>
                <span class="aioa-donut-value" aria-hidden="true"><b data-field="score">${sample ? '98' : ''}</b><small>%</small></span>
            </div>

            <div class="aioa-score-stats">
                <div class="aioa-stat">
                    <p class="aioa-stat-value" data-field="violations-pct">${sample ? '86.36%' : ''}</p>
                    <p class="aioa-stat-label">Violations Remediated</p>
                    <p class="aioa-stat-count" data-field="violations-count">${sample ? '38 / 44' : ''}</p>
                </div>
                <div class="aioa-stat">
                    <p class="aioa-stat-value" data-field="alt-pct">${sample ? '0%' : ''}</p>
                    <p class="aioa-stat-label">Alt Text Remediated</p>
                    <p class="aioa-stat-count" data-field="alt-count">${sample ? '0 / 0' : ''}</p>
                </div>
                <div class="aioa-stat">
                    <p class="aioa-stat-value" data-field="pages">${sample ? '13' : ''}</p>
                    <p class="aioa-stat-label">Web Pages Scanned</p>
                    <p class="aioa-stat-count" data-field="pages-count">${sample ? '13 / 13' : ''}</p>
                </div>
            </div>
        </div>

        <!-- Last scan date and PDF report (when the API has one) -->
        <p class="aioa-score-foot" data-sly-test="${!sample}">
            <span data-field="last-scan"></span>
            <a data-field="report" href="#" target="_blank" rel="noopener" hidden>Download PDF report<span class="visually-hidden"> (opens in a new tab)</span></a>
        </p>
    </section>
</template>
